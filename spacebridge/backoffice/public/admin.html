<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>공간브릿지 운영 콘솔</title>
<style>
  :root{--ink:#14324F;--body:#3F5265;--point:#2E7CC4;--bg:#F4F7FA;--line:#E4EBF2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--body);word-break:keep-all}
  header{background:var(--ink);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
  header b{font-size:16px}
  header .out{color:#AEC5D8;font-size:14px;background:none;border:0;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:20px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
  .kpi .n{font-size:28px;font-weight:800;color:var(--ink)}
  .kpi .l{font-size:12px;color:var(--body)}
  .bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .bar input,.bar select{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit}
  table{width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;border-collapse:collapse;overflow:hidden}
  th,td{padding:11px 12px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
  th{background:#EEF4F9;color:var(--ink);font-weight:800;font-size:12px}
  td .rc{font-weight:800;color:var(--ink)}
  select.st{padding:6px 8px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px}
  .tp{display:inline-block;font-size:11px;font-weight:800;border-radius:10px;padding:2px 8px;background:#E7F0F9;color:var(--point)}
  .login{max-width:360px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px}
  .login h1{font-size:20px;color:var(--ink);margin-bottom:16px}
  .login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;margin-bottom:10px}
  .login button{width:100%;padding:13px;background:var(--point);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:800;cursor:pointer}
  .err{color:#B85C38;font-size:13px;margin-bottom:8px;min-height:18px}
  @media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s);
async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...opt});
  return {status:r.status,data:await r.json().catch(()=>({}))};}
const STATUSES=['신규','기준안내','연결','계약','완료','보류'];

function loginView(msg){
  $('#app').innerHTML=`<div class="login"><h1>공간브릿지 운영 콘솔</h1>
    <div class="err">${msg||''}</div>
    <input id="e" type="email" placeholder="이메일" autocomplete="username">
    <input id="p" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="b">로그인</button></div>`;
  $('#b').onclick=async()=>{const r=await api('/api/login',{method:'POST',
    body:JSON.stringify({email:$('#e').value,password:$('#p').value})});
    if(r.data.ok)dash(); else loginView(r.data.error||'로그인 실패');};
  $('#p').onkeydown=e=>{if(e.key==='Enter')$('#b').click();};
}
async function dash(){
  const s=(await api('/api/stats')).data;
  $('#app').innerHTML=`<header><b>공간브릿지 운영 콘솔</b><button class="out" id="out">로그아웃</button></header>
    <div class="wrap">
      <div class="kpis">
        <div class="kpi"><div class="n">${s.total||0}</div><div class="l">총 상담</div></div>
        <div class="kpi"><div class="n">${s.신규||0}</div><div class="l">신규</div></div>
        <div class="kpi"><div class="n">${s.연결||0}</div><div class="l">연결</div></div>
        <div class="kpi"><div class="n">${s.계약||0}</div><div class="l">계약</div></div>
        <div class="kpi"><div class="n">${s.partners||0}</div><div class="l">제휴업체</div></div>
      </div>
      <div class="bar">
        <input id="q" placeholder="이름·연락처·접수번호 검색">
        <select id="fs"><option value="">전체 상태</option>${STATUSES.map(x=>`<option>${x}</option>`).join('')}</select>
      </div>
      <table><thead><tr><th>접수번호</th><th>고객</th><th>연락처</th><th>지역</th><th>분야</th><th>제3자동의</th><th>상태</th><th>접수일</th></tr></thead>
      <tbody id="rows"></tbody></table>
    </div>`;
  $('#out').onclick=async()=>{await api('/api/logout',{method:'POST'});loginView();};
  const load=async()=>{
    const q=$('#q').value,st=$('#fs').value;
    const r=await api('/api/leads?q='+encodeURIComponent(q)+'&status='+encodeURIComponent(st));
    $('#rows').innerHTML=(r.data.leads||[]).map(l=>`<tr>
      <td><span class="rc">${l.receipt_no}</span></td><td>${l.name}</td><td>${l.phone}</td>
      <td>${l.region||'-'}</td><td>${l.categories||'-'}</td>
      <td>${l.consent_thirdparty?'<span class="tp">동의</span>':'-'}</td>
      <td><select class="st" data-id="${l.id}">${STATUSES.map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select></td>
      <td>${(l.created_at||'').slice(0,16)}</td></tr>`).join('')
      ||'<tr><td colspan="8" style="text-align:center;color:#7A8B9C">상담 내역이 없습니다</td></tr>';
    document.querySelectorAll('.st').forEach(sel=>sel.onchange=async()=>{
      await api('/api/lead/status',{method:'POST',body:JSON.stringify({id:+sel.dataset.id,status:sel.value})});});
  };
  $('#q').oninput=load;$('#fs').onchange=load;load();
}
(async()=>{const me=(await api('/api/me')).data;me.user?dash():loginView();})();
</script>
</body></html>
