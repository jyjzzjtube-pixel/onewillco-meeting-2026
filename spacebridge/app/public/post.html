<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창업가이드 | 공간브릿지</title>
<style>
:root{--ink:#2B2A26;--sub:#75716A;--bg:#F7F5F1;--green:#1E3A2F;--copper:#B85C38;--line:#E5E1D8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
.hwrap{max-width:800px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;}
.logo{font-size:22px;font-weight:800;color:var(--green);text-decoration:none;letter-spacing:-.5px;}
.logo b{color:var(--copper);}
.hwrap a.back{color:var(--sub);text-decoration:none;font-size:14px;font-weight:600;}
.wrap{max-width:800px;margin:0 auto;padding:40px 20px 80px;}
.cat{display:inline-block;font-size:12px;font-weight:800;color:var(--copper);background:#F6E8E0;border-radius:10px;padding:3px 12px;}
h1{font-size:26px;font-weight:800;color:var(--green);letter-spacing:-.5px;margin:12px 0 6px;}
.meta{font-size:13px;color:var(--sub);padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:26px;}
.body{background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;font-size:15.5px;white-space:pre-wrap;word-break:break-word;}
.cta-band{margin-top:34px;background:var(--green);border-radius:14px;padding:26px;color:#fff;text-align:center;}
.cta-band p{margin-bottom:14px;font-weight:700;font-size:16px;}
.cta-band a{background:var(--copper);color:#fff;text-decoration:none;font-weight:800;border-radius:10px;padding:12px 24px;font-size:14px;display:inline-block;}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <a class="logo" href="/">공간<b>브릿지</b></a>
    <a class="back" href="/guide.html">← 목록으로</a>
  </div>
</header>
<div class="wrap">
  <span class="cat" id="cat"></span>
  <h1 id="title">불러오는 중…</h1>
  <div class="meta" id="meta"></div>
  <div class="body" id="body"></div>
  <div class="cta-band">
    <p>상가 계약하셨나요? 인테리어부터 포스·CCTV·세무까지 통합 견적은 무료입니다.</p>
    <a href="/#quote">무료 견적 신청 →</a>
  </div>
</div>
<script src="/track.js"></script>
<script>
(function(){
  var id=new URLSearchParams(location.search).get('id');
  fetch('/api/posts/'+id).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(p){
    document.title=p.title+' | 공간브릿지 창업가이드';
    document.getElementById('cat').textContent=p.cat;
    document.getElementById('title').textContent=p.title;
    var d=new Date(p.created);
    document.getElementById('meta').textContent=d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'. · 조회 '+(p.views||0);
    document.getElementById('body').textContent=p.body;
  }).catch(function(){
    document.getElementById('title').textContent='글을 찾을 수 없습니다';
    document.getElementById('body').textContent='삭제되었거나 주소가 잘못되었습니다.';
  });
})();
</script>
</body>
</html>
